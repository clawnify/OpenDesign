<!-- The app's identity object: a squircle in the accent hue with a white glyph.
     An asset cannot read a CSS custom property, so the accent is written out
     here; it is the same value as --accent in src/client/styles.css. -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#DF3656"/>
  <rect x="14" y="14" width="36" height="36" rx="4" fill="#fff"/>
  <circle cx="26" cy="27" r="5.5" fill="#DF3656"/>
  <path d="M30 44l8-13 8 13H30z" fill="#DF3656"/>
  <rect x="18" y="40" width="9" height="4" rx="2" fill="#DF3656" fill-opacity="0.45"/>
</svg>
